name: Validate Radar Data
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate historical entries
        run: node scripts/validate-data.mjs
      - name: Check required frontend files
        run: |
          test -s index.html
          test -s assets/styles.css
          test -s assets/app.js
          test -s data/history.js
