name: Publish editor-reviewed radar HTML to Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: radar-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build site and run tests from committed HTML
        run: npm run check
      - name: Verify immutable daily HTML snapshots
        run: |
          git diff --exit-code -- ':(glob)archive/*/*/[0-3][0-9].html'
          if [ -n "$(git ls-files --others --exclude-standard -- ':(glob)archive/*/*/[0-3][0-9].html')" ]; then
            echo "Build generated unexpected daily HTML snapshots"
            exit 1
          fi
      - name: Install browser regression tools
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.64.1
      - name: Use preinstalled Chrome and optional CJK fonts
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        timeout-minutes: 2
        run: |
          google-chrome --version
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            timeout 35s sudo apt-get update -qq || true
            timeout 45s sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji >/dev/null || true
            fc-cache -f || true
          fi
      - name: Browser regression
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: npx playwright test
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload HTML-only Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy current HTML artifact
        id: deployment
        uses: actions/deploy-pages@v4
