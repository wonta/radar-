name: Daily radar HTML and Pages
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '15 23 * * *' # 08:15 Japan time
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radar-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Convert the frozen legacy archive and prior daily JSON (one-time)
        run: node scripts/migrate-archive.mjs
      - name: Gather today's GitHub projects directly to HTML
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/daily-scout.mjs
      - name: Build indexes, site and verify snapshots
        run: npm run check
      - name: Install browser regression tools
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.64.1
      - name: Use preinstalled Chrome and install CJK fonts for browser QA
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          google-chrome --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          fc-cache -f
      - name: Browser regression
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: npx playwright test
      - name: Commit generated HTML and remove daily JSON files
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new HTML to commit"
          else
            git commit -m "content: update immutable daily HTML archive and indexes"
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload HTML-only Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy current HTML artifact
        id: deployment
        uses: actions/deploy-pages@v4
